name: Release

on:
  push:
    tags:
    - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: pnpm

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri

    - run: pnpm install --frozen-lockfile

    - name: Download ipatool
      shell: pwsh
      run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/fetch-ipatool.ps1

    - run: pnpm build:web

    - name: Get version
      id: version
      shell: pwsh
      run: |
        $version = $env:GITHUB_REF_NAME -replace '^v', ''
        if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
          throw "tag 必须为 vX.Y.Z.W 四段格式: $env:GITHUB_REF_NAME"
        }
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: build x64
      shell: pwsh
      working-directory: src-tauri
      run: cargo build --release --features custom-protocol --target x86_64-pc-windows-msvc

    - name: build arm64
      shell: pwsh
      working-directory: src-tauri
      run: cargo build --release --features custom-protocol --target aarch64-pc-windows-msvc

    - name: make msixbundle
      shell: pwsh
      run: >
        pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/make-msix.ps1 -Version '${{ steps.version.outputs.version }}' -TargetArch x64,arm64 -RustTarget x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

    - uses: ncipollo/release-action@v1
      with:
        artifacts: msix/out/IPAbuyer_*.msixbundle
        generateReleaseNotes: true
        allowUpdates: true
