[package]
name = "ipabuyer"
version = "2026.9.14"
description = "IPAbuyer - Tauri 2 build for Microsoft Store"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "IPAbuyer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# core 业务逻辑（并入自 IPAbuyer.Core，版本对齐原 crate）
chrono = "0.4"
fancy-regex = "0.13"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
